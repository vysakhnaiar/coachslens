<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach's Lens - Pro Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, getDocs, deleteDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- Your Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDIXjcyJUtypEn1IEUDHoS6G6O6y_EikEE",
            authDomain: "coach-s-lens.firebaseapp.com",
            projectId: "coach-s-lens",
            storageBucket: "coach-s-lens.firebasestorage.app",
            messagingSenderId: "1005983098932",
            appId: "1:1005983098932:web:0265751d1388357ef6c261",
            measurementId: "G-BCEBHTX0L6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- AUTH UI LOGIC ---
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("Login Failed: Check credentials."); }
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) return; // If viewing a report, stay on interface

            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                loadDashboard();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-interface').classList.add('hidden');
            }
        });

        // --- DASHBOARD LOGIC ---
        window.loadDashboard = async () => {
            const list = document.getElementById('dashList');
            list.innerHTML = "<p class='p-4 text-[10px] italic text-gray-400'>Loading Database...</p>";
            const q = query(collection(db, "player_reports"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            list.innerHTML = "";
            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const shareURL = window.location.href.split('?')[0] + "?id=" + docSnap.id;
                list.innerHTML += `
                    <div class="p-3 border-b hover:bg-slate-50 flex justify-between items-center group">
                        <div class="cursor-pointer" onclick="window.location.href='${shareURL}'">
                            <p class="font-bold text-xs text-slate-700">${data.playerName || 'New Player'}</p>
                            <p class="text-[9px] text-emerald-600 font-black uppercase">${data.pRole}</p>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="navigator.clipboard.writeText('${shareURL}'); alert('Link Copied!')" class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[9px] font-bold">LINK</button>
                            <button onclick="deleteR('${docSnap.id}')" class="bg-red-100 text-red-700 px-2 py-1 rounded text-[9px] font-bold">DEL</button>
                        </div>
                    </div>`;
            });
        };

        window.deleteR = async (id) => { if(confirm("Delete permanently?")) { await deleteDoc(doc(db, "player_reports", id)); loadDashboard(); } };

        // --- SAVE TO CLOUD ---
        window.saveToCloud = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SAVING...";
            const data = {};
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.value; });
            
            try {
                await addDoc(collection(db, "player_reports"), { ...data, timestamp: new Date() });
                alert("Pro Analysis Saved!");
                btn.innerText = "SAVE PLAYER";
                loadDashboard();
            } catch (e) { alert("Save Error: " + e.message); btn.innerText = "SAVE PLAYER"; }
        };

        // --- PLAYER VIEW LOAD ---
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const reportId = params.get('id');
            if (reportId) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                document.getElementById('dashSide').classList.add('hidden');
                document.getElementById('coachTools').classList.add('hidden');
                
                const snap = await getDoc(doc(db, "player_reports", reportId));
                if (snap.exists()) {
                    const data = snap.data();
                    Object.keys(data).forEach(key => {
                        const el = document.getElementById(key);
                        if(el) { el.value = data[key]; el.disabled = true; el.style.background = "#f1f5f9"; }
                    });
                    updateUI();
                }
            }
        };

        // --- PROFESSIONAL PDF EXPORT ---
        window.downloadPDF = async () => {
            const data = {
                name: document.getElementById('playerName').value,
                age: document.getElementById('pAge').value,
                role: document.getElementById('pRole').value,
                hand: document.getElementById('pHand').value,
                summary: document.getElementById('pSummary').value,
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
            };

            const pdfTemplate = document.createElement('div');
            pdfTemplate.style.padding = "40px";
            pdfTemplate.style.width = "800px";
            pdfTemplate.style.background = "white";
            pdfTemplate.innerHTML = `
                <div style="font-family: Arial, sans-serif; border: 2px solid #e2e8f0; padding: 20px; border-radius: 10px;">
                    <div style="display: flex; justify-content: space-between; border-bottom: 5px solid #065f46; padding-bottom: 15px; margin-bottom: 20px;">
                        <div><h1 style="margin:0; color:#065f46; font-size:30px;">COACH'S LENS</h1><p style="margin:0; font-size:10px; font-weight:bold; color:#64748b; letter-spacing:2px;">PRO PERFORMANCE REPORT</p></div>
                        <div style="text-align:right;"><p style="margin:0; font-size:12px;"><b>Date:</b> ${data.date}</p></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px; font-size:12px;">
                        <div><small style="color:#64748b; font-weight:bold;">PLAYER</small><br><b>${data.name}</b></div>
                        <div><small style="color:#64748b; font-weight:bold;">AGE</small><br><b>${data.age}</b></div>
                        <div><small style="color:#64748b; font-weight:bold;">ROLE</small><br><b>${data.role}</b></div>
                        <div><small style="color:#64748b; font-weight:bold;">STYLE</small><br><b>${data.hand}</b></div>
                    </div>
                    <h3 style="font-size:14px; color:#065f46; border-bottom:1px solid #e2e8f0; padding-bottom:5px;">TECHNICAL ASSESSMENT</h3>
                    <table style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:20px;">
                        <tr style="background:#065f46; color:white;"><th style="padding:8px; text-align:left;">Category</th><th style="padding:8px; text-align:left;">Observation</th></tr>
                        ${Array.from(document.querySelectorAll('select:not(#pRole):not(#pHand)')).map(s => {
                            if(s.closest('.section-hidden')) return '';
                            const label = s.previousElementSibling?.innerText || "Technique";
                            const val = s.value;
                            const color = val.includes("Ideal") ? "#10b981" : "#ef4444";
                            return `<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:6px; font-weight:bold; color:#64748b;">${label}</td><td style="padding:6px; color:${color}; font-weight:bold;">${val}</td></tr>`;
                        }).join('')}
                    </table>
                    <h3 style="font-size:14px; color:#065f46;">COACH SUMMARY</h3>
                    <p style="font-size:12px; line-height:1.5; color:#334155; background:#fffbeb; padding:15px; border-radius:8px; border:1px solid #fef3c7;">${data.summary.replace(/\n/g, '<br>')}</p>
                    <div style="margin-top:30px; display:flex; gap:10px;">
                        <div style="flex:1; border:1px dashed #10b981; padding:10px; border-radius:5px;"><small style="color:#10b981; font-weight:bold;">ACTION 1</small><br><b style="font-size:11px;">${document.getElementById('act1').value || 'Standard Drills'}</b></div>
                        <div style="flex:1; border:1px dashed #10b981; padding:10px; border-radius:5px;"><small style="color:#10b981; font-weight:bold;">ACTION 2</small><br><b style="font-size:11px;">${document.getElementById('act2').value || 'Video Review'}</b></div>
                    </div>
                </div>
            `;

            html2pdf().set({ margin: 0, filename: `Report_${data.name}.pdf`, html2canvas: { scale: 4 }, jsPDF: { unit: 'in', format: 'a4' } }).from(pdfTemplate).save();
        };
    </script>

    <style>
        .section-hidden { display: none; }
        .ideal { color: #10b981; font-weight: bold; }
        .form-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        label { font-weight: 800; color: #64748b; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 0.2rem; display: block; }
        select, input, textarea { border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; font-size: 0.85rem; width: 100%; background: #fff; }
        .sheet-label { background: #0f172a; color: white; padding: 2px 10px; border-radius: 4px; font-size: 9px; font-weight: 900; margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4 hidden">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500 text-center">
            <h1 class="text-4xl font-black italic text-slate-900 mb-2 tracking-tighter">COACH'S LENS</h1>
            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[.3em] mb-8 border-b pb-4">Professional Admin Portal</p>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div><label>Email</label><input type="email" id="loginEmail" required></div>
                <div><label>Password</label><input type="password" id="loginPass" required></div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-slate-900 text-emerald-400 font-black py-4 rounded-xl hover:bg-black transition uppercase tracking-widest text-xs">Authorize Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-interface" class="hidden">
        <nav id="navBar" class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center no-print shadow-xl">
            <div class="flex items-center gap-2"><div class="bg-emerald-500 text-slate-900 font-black p-1 rounded text-xs">CL</div><h1 class="text-xl font-black italic text-emerald-400 tracking-tighter">COACH'S LENS</h1></div>
            <div id="coachTools" class="flex gap-4 items-center">
                <button id="saveBtn" onclick="saveToCloud()" class="bg-emerald-600 px-6 py-2 rounded-md font-black text-[10px] uppercase tracking-widest hover:bg-emerald-500">Save Player</button>
                <button onclick="handleLogout()" class="text-[10px] font-bold text-slate-500 hover:text-white underline">Exit</button>
            </div>
        </nav>

        <div class="max-w-[1500px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6 p-6">
            <aside id="dashSide" class="lg:col-span-1"><div class="bg-white rounded-xl shadow-lg border border-slate-200 sticky top-24 overflow-hidden"><p class="bg-slate-800 text-white p-2 text-[10px] font-black uppercase text-center">Cloud Database</p><div id="dashList" class="max-h-[750px] overflow-y-auto"></div></div></aside>
            
            <main id="report-content" class="lg:col-span-3">
                <!-- BIO -->
                <div class="form-card border-l-8 border-emerald-500">
                    <span class="sheet-label">Sheet 1: Core Profile</span>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label>Name</label><input type="text" id="playerName"></div>
                        <div><label>Age</label><input type="number" id="pAge"></div>
                        <div><label>Role</label><select id="pRole" onchange="updateUI()"><option value="Batter">Batter</option><option value="Bowler">Bowler</option><option value="All rounder">All rounder</option><option value="WK batter">WK batter</option></select></div>
                        <div><label>Hand</label><select id="pHand"><option>RH</option><option>LH</option></select></div>
                    </div>
                </div>

                <!-- BATTING (SHEETS 2-4) -->
                <div id="section-batting" class="space-y-4">
                    <div class="form-card border-t-4 border-blue-600">
                        <span class="sheet-label !bg-blue-600 uppercase">Sheet 2: Grip & Setup</span>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <div><label>Grip Handle</label><select id="b_gr_h"><option class="ideal">Ideal (Middle-MH)</option><option>Top(TH)</option><option>Bottom(BH)</option></select></div>
                            <div><label>Top Hand V</label><select id="b_gr_tv"><option class="ideal">Ideal (Splice-SP)</option><option>Outer(BSO)</option><option>Inner(BSI)</option></select></div>
                            <div><label>Guard</label><select id="b_gu"><option class="ideal">Middle(MS)</option><option>Leg(LS)</option><option>Off(OS)</option></select></div>
                            <div><label>Width</label><select id="b_wi"><option class="ideal">Shoulder(SW)</option><option>Narrow(NW)</option><option>Wide(WD)</option></select></div>
                            <div><label>Weight Dist.</label><select id="b_wt"><option class="ideal">Balanced(WEB)</option><option>Back Foot(WBF)</option><option>Front Foot(WFF)</option></select></div>
                            <div><label>Head/Eyes</label><select id="b_he"><option class="ideal">Steady & Level(HS)</option><option>Two Eyed(2E)</option></select></div>
                        </div>
                    </div>
                    <div class="form-card border-t-4 border-blue-400">
                        <span class="sheet-label !bg-blue-400 uppercase">Sheet 3: Technical Execution</span>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <div><label>Backlift Initiation</label><select id="b_bi"><option class="ideal">Ideal (Top Hand-THC)</option><option>Bottom Hand(BTH)</option></select></div>
                            <div><label>Backlift Path</label><select id="b_bp"><option class="ideal">Ideal (Straight-ST)</option><option>Gully(GU)</option><option>Fine Leg(FL)</option></select></div>
                            <div><label>Trigger Timing</label><select id="b_tt"><option class="ideal">Ideal (On Time-OT)</option><option>Early(EY)</option><option>Late(LT)</option></select></div>
                            <div><label>Movement Pattern</label><select id="b_mp"><option class="ideal">Ideal (Minimal-M)</option><option>Excessive(E)</option></select></div>
                            <div class="md:col-span-2"><label>OnForm Video Analysis Link</label><input type="text" id="b_link" placeholder="Paste URL"></div>
                        </div>
                    </div>
                </div>

                <!-- BOWLING -->
                <div id="section-bowling" class="form-card border-t-4 border-red-600 section-hidden">
                    <span class="sheet-label !bg-red-600 uppercase">Video Analysis: Bowling</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label>Run Up</label><select id="bo_ru"><option class="ideal">Ideal (Straight)</option><option>Curved</option></select></div>
                        <div><label>Loading</label><select id="bo_lo"><option class="ideal">Ideal (Close)</option><option>Away</option></select></div>
                        <div><label>Release Position</label><select id="bo_re"><option class="ideal">Ideal (Vertical)</option><option>Round Arm</option></select></div>
                    </div>
                </div>

                <!-- WK -->
                <div id="section-wk" class="form-card border-t-4 border-orange-500 section-hidden">
                    <span class="sheet-label !bg-orange-600 uppercase">Video Analysis: Wicket Keeping</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label>Crouch</label><select id="wk_cr"><option class="ideal">Ideal (Balanced)</option><option>Feet wide</option></select></div>
                        <div><label>Spinners Footwork</label><select id="wk_fw"><option class="ideal">Ideal (K-shape)</option><option>Curve</option></select></div>
                        <div><label>Glove Work</label><select id="wk_gw"><option class="ideal">Ideal (Soft Hands)</option><option>Hard Hands</option></select></div>
                    </div>
                </div>

                <!-- FIELDING -->
                <div class="form-card border-t-4 border-purple-600">
                    <span class="sheet-label !bg-purple-600 uppercase">Fielding & Throwing Assessment</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label>Non-Throw Hand</label><select id="th_nt"><option class="ideal">Ideal (Steady)</option><option>Drop</option></select></div>
                        <div><label>Elbow Level</label><select id="th_el"><option class="ideal">Ideal (Shoulder)</option><option>Below</option></select></div>
                        <div><label>Alignment</label><select id="th_al"><option class="ideal">Ideal (Target)</option><option>Open</option></select></div>
                    </div>
                </div>

                <!-- SUMMARY -->
                <div class="form-card bg-slate-900 text-white shadow-2xl">
                    <h3 class="text-emerald-400 font-black mb-4 uppercase tracking-widest text-xs">Coach Observations & Action Plan</h3>
                    <textarea id="pSummary" class="text-slate-900 h-40 w-full p-4 rounded-md" placeholder="Technical breakdown..."></textarea>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <input type="text" id="act1" class="text-slate-900" placeholder="Priority 1 Fix">
                        <input type="text" id="act2" class="text-slate-900" placeholder="Priority 2 Fix">
                    </div>
                    <button onclick="downloadPDF()" class="mt-8 bg-white text-slate-900 font-black py-4 rounded-xl w-full uppercase text-xs tracking-widest shadow-xl hover:bg-slate-100 transition">Download Elite PDF Analysis</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        function updateUI() {
            const role = document.getElementById('pRole').value;
            const bat = document.getElementById('section-batting');
            const bowl = document.getElementById('section-bowling');
            const wk = document.getElementById('section-wk');
            [bat, bowl, wk].forEach(s => s.classList.add('section-hidden'));
            if (role === 'Batter' || role === 'All rounder' || role === 'WK batter') bat.classList.remove('section-hidden');
            if (role === 'Bowler' || role === 'All rounder') bowl.classList.remove('section-hidden');
            if (role === 'WK batter') wk.classList.remove('section-hidden');
        }
        updateUI();
    </script>
</body>
</html>
