<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach's Lens - Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIXjcyJUtypEn1IEUDHoS6G6O6y_EikEE",
            authDomain: "coach-s-lens.firebaseapp.com",
            projectId: "coach-s-lens",
            storageBucket: "coach-s-lens.firebasestorage.app",
            messagingSenderId: "1005983098932",
            appId: "1:1005983098932:web:0265751d1388357ef6c261",
            measurementId: "G-BCEBHTX0L6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- AUTH & DATABASE LOGIC ---
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (e) { alert("Login Failed"); }
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) return;
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                loadDashboard();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-interface').classList.add('hidden');
            }
        });

        window.loadDashboard = async () => {
            const list = document.getElementById('dashList');
            list.innerHTML = "<p class='p-4 text-[10px] italic uppercase'>Syncing Cloud...</p>";
            const q = query(collection(db, "player_reports"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            list.innerHTML = "";
            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const shareURL = window.location.href.split('?')[0] + "?id=" + docSnap.id;
                list.innerHTML += `<div class="p-3 border-b hover:bg-slate-50 flex justify-between items-center">
                    <div class="cursor-pointer" onclick="window.location.href='${shareURL}'">
                        <p class="font-bold text-xs text-slate-700">${data.playerName || 'Player'}</p>
                        <p class="text-[9px] text-emerald-600 uppercase font-black tracking-tighter">${data.role}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="navigator.clipboard.writeText('${shareURL}'); alert('Link Copied!')" class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[9px] font-bold">LINK</button>
                        <button onclick="deleteR('${docSnap.id}')" class="bg-red-100 text-red-700 px-2 py-1 rounded text-[9px] font-bold">DEL</button>
                    </div>
                </div>`;
            });
        };

        window.deleteR = async (id) => { if(confirm("Delete Permanently?")) { await deleteDoc(doc(db, "player_reports", id)); loadDashboard(); } };

        window.saveToCloud = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SAVING...";
            const data = {};
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.value; });
            try {
                await addDoc(collection(db, "player_reports"), { ...data, timestamp: new Date() });
                alert("Pro Analysis Saved!"); btn.innerText = "SAVE PLAYER"; loadDashboard();
            } catch (e) { alert("Save error"); btn.innerText = "SAVE PLAYER"; }
        };

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const reportId = params.get('id');
            if (reportId) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                document.getElementById('dashSide').classList.add('hidden');
                document.getElementById('coachHeaderControls').classList.add('hidden');
                const snap = await getDoc(doc(db, "player_reports", reportId));
                if (snap.exists()) {
                    const data = snap.data();
                    Object.keys(data).forEach(key => {
                        const el = document.getElementById(key);
                        if(el) { el.value = data[key]; el.disabled = true; el.style.background = "#f8fafc"; }
                    });
                    updateUI();
                }
            }
        };

        // --- THE COMPLETE PDF ENGINE ---
        window.downloadPDF = async () => {
            const pName = document.getElementById('playerName').value || "Unnamed";
            const pAge = document.getElementById('age').value || "N/A";
            const pRole = document.getElementById('role').value;
            const pHand = document.getElementById('hand').value;
            const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

            const pdfContainer = document.createElement('div');
            pdfContainer.style.width = "800px";
            pdfContainer.style.background = "white";
            pdfContainer.style.margin = "0";
            pdfContainer.style.padding = "0";
            
            let html = `
                <div style="font-family: Arial, sans-serif; padding: 40px; color: #1e293b;">
                    <!-- HEADER - MOVED TO TOP -->
                    <div style="display: flex; justify-content: space-between; border-bottom: 5px solid #065f46; padding-bottom: 10px; margin-bottom: 20px;">
                        <div>
                            <h1 style="margin:0; color:#065f46; font-size:32px; font-weight:900; line-height:1;">COACH'S LENS</h1>
                            <p style="margin:0; font-size:10px; font-weight:bold; color:#64748b; text-transform:uppercase; letter-spacing:2px;">Elite Player Performance Analysis</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="margin:0; font-size:14px; color:#1e293b;"><b>DATE:</b> ${dateStr}</p>
                        </div>
                    </div>

                    <!-- BASIC INFO -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:25px; border:1px solid #e2e8f0; font-size:12px;">
                        <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Player</small><br><b>${pName}</b></div>
                        <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Age</small><br><b>${pAge}</b></div>
                        <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Role</small><br><b>${pRole}</b></div>
                        <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Hand</small><br><b>${pHand}</b></div>
                    </div>`;

            // Function to grab ALL data in a section
            // Checks the element itself AND any ancestor for the 'section-hidden' class,
            // since some sections (batting) are hidden via a parent wrapper, not themselves.
            const getSectionData = (title, elementId) => {
                const section = document.getElementById(elementId);
                if (!section) return '';
                if (section.classList.contains('section-hidden')) return '';
                if (section.closest('.section-hidden')) return '';

                let sHtml = `<div class="pdf-block" style="page-break-inside: avoid; break-inside: avoid;">
                             <h2 style="font-size: 14px; color: #065f46; border-bottom: 2px solid #065f46; padding-bottom: 3px; margin-top:16px; margin-bottom: 8px; text-transform: uppercase;">${title}</h2>
                             <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 11px;">`;

                const inputs = section.querySelectorAll('select, input:not([type="button"])');
                inputs.forEach(el => {
                    const label = el.previousElementSibling?.innerText || "Technique";
                    const val = el.value || "Ideal";
                    const color = val.includes("Ideal") ? "#10b981" : "#ef4444";
                    sHtml += `<tr style="border-bottom: 1px solid #f1f5f9;">
                                <td style="padding: 6px 8px; color: #64748b; font-weight: bold; width: 45%; text-transform: uppercase; font-size: 9px;">${label}</td>
                                <td style="padding: 6px 8px; color: ${color}; font-weight: bold;">${val}</td>
                             </tr>`;
                });
                sHtml += `</table></div>`;
                return sHtml;
            };

            // ADD EVERY SINGLE SECTION (IDs now match the actual elements in the DOM)
            html += getSectionData("Batting: Grip & Stance", "sec-bat-grip");
            html += getSectionData("Batting: Technical Execution", "sec-bat-tech");
            html += getSectionData("Bowling Analysis", "section-bowling");
            html += getSectionData("Wicket Keeping", "section-wk");
            html += getSectionData("Fielding & Throwing", "section-fielding");

            // SUMMARY
            html += `
                <div class="pdf-block" style="page-break-inside: avoid; break-inside: avoid; margin-top: 16px; border-top: 3px solid #065f46; padding-top:12px;">
                    <h2 style="font-size: 14px; color: #065f46; margin-bottom: 8px; text-transform: uppercase;">Coach's Overall Summary</h2>
                    <div style="background: #fffbeb; border: 1px solid #fef3c7; padding: 16px; border-radius: 8px; font-size: 12px; line-height: 1.6; color: #451a03;">
                        ${(document.getElementById('pSummary').value || "No final summary provided.").replace(/\n/g, '<br>')}
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center; font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">
                    Verified Professional Performance Document | Coach's Lens Analytics
                </div>
            </div>`;

            pdfContainer.innerHTML = html;
            // Container must be attached to the DOM (off-screen) for html2canvas to measure/render it correctly
            pdfContainer.style.position = "fixed";
            pdfContainer.style.left = "-9999px";
            pdfContainer.style.top = "0";
            document.body.appendChild(pdfContainer);

            const opt = {
                margin: [10, 10, 10, 10],
                filename: `CoachsLens_Full_Report_${pName}.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, y: 0, scrollY: 0 },
                jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
                // 'css' mode respects page-break-inside:avoid on .pdf-block so a section
                // never gets sliced in half; 'avoid-all' packs content tightly to remove
                // the leftover blank space that fixed-height slicing used to leave.
                pagebreak: { mode: ['css', 'avoid-all'], avoid: ['.pdf-block', 'tr'] }
            };

            html2pdf().set(opt).from(pdfContainer).save().then(() => {
                document.body.removeChild(pdfContainer);
            });
        };
    </script>

    <style>
        .section-hidden { display: none; }
        .form-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { font-weight: 800; color: #64748b; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 0.2rem; display: block; }
        select, input, textarea { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 0.85rem; width: 100%; }
        .pro-tag { background: #0f172a; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4 hidden">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter mb-4">COACH'S LENS</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div><label>Coach Email</label><input type="email" id="loginEmail" required></div>
                <div><label>Password</label><input type="password" id="loginPass" required></div>
                <button type="submit" class="w-full bg-slate-900 text-emerald-400 font-black py-4 rounded-xl uppercase tracking-widest text-xs shadow-lg">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-interface" class="hidden">
        <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center no-print shadow-xl">
            <h1 class="text-xl font-black italic tracking-tighter text-emerald-400">COACH'S LENS</h1>
            <div id="coachHeaderControls" class="flex gap-4 items-center">
                <button id="saveBtn" onclick="saveToCloud()" class="bg-emerald-600 px-6 py-2 rounded-md font-black text-[10px] uppercase shadow-lg">Save Player</button>
                <button onclick="handleLogout()" class="text-[10px] font-bold text-slate-400 underline">Logout</button>
            </div>
        </nav>

        <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6 p-6">
            <!-- DASHBOARD -->
            <aside id="dashSide" class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow border sticky top-24 overflow-hidden">
                    <p class="bg-slate-800 text-white p-2 text-[10px] font-black uppercase text-center">Cloud Records</p>
                    <div id="dashList" class="max-h-[700px] overflow-y-auto"></div>
                </div>
            </aside>

            <!-- FORM CONTENT -->
            <main id="report-content" class="lg:col-span-3">
                
                <!-- PROFILE -->
                <div class="form-card border-l-8 border-emerald-500">
                    <span class="pro-tag">Basic Profile</span>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label>Player Name</label><input type="text" id="playerName"></div>
                        <div><label>Age</label><input type="number" id="age"></div>
                        <div><label>Role</label><select id="role" onchange="updateUI()"><option value="Batter">Batter</option><option value="Bowler">Bowler</option><option value="All rounder">All rounder</option><option value="WK batter">WK batter</option></select></div>
                        <div><label>Hand</label><select id="hand"><option>RH</option><option>LH</option></select></div>
                    </div>
                </div>

                <!-- BATTING -->
                <div id="section-batting" class="space-y-4">
                    <div id="sec-bat-grip" class="form-card border-t-4 border-blue-600">
                        <span class="pro-tag !bg-blue-600">Grip & Setup</span>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                            <div><label>Handle Position</label><select id="b_h"><option value="Ideal (Middle-MH)">Ideal (Middle-MH)</option><option value="Top(TH)">Top(TH)</option><option value="Bottom(BH)">Bottom(BH)</option></select></div>
                            <div><label>Top Hand V</label><select id="b_tv"><option value="Ideal (Splice-SP)">Ideal (Splice-SP)</option><option value="Outer(BSO)">Outer(BSO)</option><option value="Inner(BSI)">Inner(BSI)</option></select></div>
                            <div><label>Bottom Hand V</label><select id="b_bv"><option value="Ideal (Splice-SP)">Ideal (Splice-SP)</option><option value="Outer(BSO)">Outer(BSO)</option><option value="Inner(BSI)">Inner(BSI)</option></select></div>
                            <div><label>Guard Position</label><select id="b_g"><option value="Middle(MS)">Middle(MS)</option><option value="Leg(LS)">Leg(LS)</option><option value="Off(OS)">Off(OS)</option></select></div>
                            <div><label>Stance Width</label><select id="b_w"><option value="Shoulder Width(SW)">Shoulder Width(SW)</option><option value="Narrow(NW)">Narrow(NW)</option><option value="Wide(WD)">Wide(WD)</option></select></div>
                            <div><label>Weight Dist.</label><select id="b_wt"><option value="Balanced(WEB)">Balanced(WEB)</option><option value="Back Foot(WBF)">Back Foot(WBF)</option><option value="Front Foot(WFF)">Front Foot(WFF)</option></select></div>
                        </div>
                    </div>
                    <div id="sec-bat-tech" class="form-card border-t-4 border-blue-400">
                        <span class="pro-tag !bg-blue-400">Backlift & Trigger</span>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                            <div><label>Backlift Path</label><select id="b_bp"><option value="Straight(ST)">Straight(ST)</option><option value="Gully(GU)">Gully(GU)</option><option value="Fine Leg(FL)">Fine Leg(FL)</option></select></div>
                            <div><label>Trigger Timing</label><select id="b_tt"><option value="Ideal (On Time-OT)">Ideal (On Time-OT)</option><option value="Early(EY)">Early(EY)</option><option value="Late(LT)">Late(LT)</option></select></div>
                            <div><label>Movement Pattern</label><select id="b_mp"><option value="Minimal(M)">Minimal(M)</option><option value="Excessive(E)">Excessive(E)</option></select></div>
                        </div>
                    </div>
                </div>

                <!-- BOWLING -->
                <div id="section-bowling" class="form-card border-t-4 border-red-600 section-hidden">
                    <span class="pro-tag !bg-red-600">Bowling Technicals</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label>Run Up</label><select id="bo_ru"><option value="Ideal (Straight)">Ideal (Straight)</option><option value="Curved">Curved</option></select></div>
                        <div><label>Loading</label><select id="bo_lo"><option value="Ideal (Close)">Ideal (Close)</option><option value="Away">Away</option></select></div>
                        <div><label>Release Position</label><select id="bo_re"><option value="Ideal (Vertical)">Ideal (Vertical)</option><option value="Round Arm">Round Arm</option></select></div>
                    </div>
                </div>

                <!-- WK -->
                <div id="section-wk" class="form-card border-t-4 border-orange-600 section-hidden">
                    <span class="pro-tag !bg-orange-600">Wicket Keeping</span>
                    <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
                        <div><label>Crouch Position</label><select id="wk_cr"><option value="Ideal (Balanced)">Ideal (Balanced)</option><option value="Feet too wide">Feet too wide</option></select></div>
                        <div><label>Glove Work</label><select id="wk_gw"><option value="Ideal (Soft Hands)">Ideal (Soft Hands)</option><option value="Hard Hands">Hard Hands</option></select></div>
                    </div>
                </div>

                <!-- FIELDING -->
                <div id="section-fielding" class="form-card border-t-4 border-purple-600">
                    <span class="pro-tag !bg-purple-600">Fielding & Throwing</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label>Non-Throw Hand</label><select id="fi_nt"><option value="Ideal (Steady)">Ideal (Steady)</option><option value="Drop">Drop</option></select></div>
                        <div><label>Elbow Level</label><select id="fi_el"><option value="Ideal (Shoulder)">Ideal (Shoulder)</option><option value="Below Shoulder">Below Shoulder</option></select></div>
                        <div><label>Alignment</label><select id="fi_al"><option value="Ideal (Towards Target)">Ideal (Towards Target)</option><option value="Open">Open</option></select></div>
                    </div>
                </div>

                <!-- SUMMARY -->
                <div class="form-card bg-slate-900 text-white shadow-2xl">
                    <label class="text-emerald-400">Coach Observations</label>
                    <textarea id="pSummary" class="text-slate-900 h-40 w-full p-4 rounded-md mb-6" placeholder="Detailed notes..."></textarea>
                    <button onclick="downloadPDF()" class="bg-emerald-500 text-slate-900 font-black py-4 rounded-xl w-full uppercase tracking-widest text-xs shadow-lg">Download Professional Full Report</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        function updateUI() {
            const role = document.getElementById('role').value;
            const bat = document.getElementById('section-batting');
            const bowl = document.getElementById('section-bowling');
            const wk = document.getElementById('section-wk');
            bat.classList.add('section-hidden'); bowl.classList.add('section-hidden'); wk.classList.add('section-hidden');
            if (role === 'Batter' || role === 'All rounder' || role === 'WK batter') bat.classList.remove('section-hidden');
            if (role === 'Bowler' || role === 'All rounder') bowl.classList.remove('section-hidden');
            if (role === 'WK batter') wk.classList.remove('section-hidden');
        }
        updateUI();
    </script>
</body>
</html>
