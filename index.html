<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach's Lens - Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, getDocs, deleteDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIXjcyJUtypEn1IEUDHoS6G6O6y_EikEE",
            authDomain: "coach-s-lens.firebaseapp.com",
            projectId: "coach-s-lens",
            storageBucket: "coach-s-lens.firebasestorage.app",
            messagingSenderId: "1005983098932",
            appId: "1:1005983098932:web:0265751d1388357ef6c261",
            measurementId: "G-BCEBHTX0L6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ============================================================
        // FIELD / SECTION DEFINITIONS — single source of truth.
        // Drives: the session form fields, the PDF/report tables, the
        // role-based visibility rules, and the "flagged" counters.
        // Having one config instead of separate hard-coded lists is what
        // caused the last version to silently drop sections.
        // ============================================================
        const ROLE_BATTING = ['Batter', 'All rounder', 'WK batter'];
        const ROLE_BOWLING = ['Bowler', 'All rounder'];
        const ROLE_WK = ['WK batter'];

        const SECTIONS = [
            {
                key: 'bat_grip', title: "Batting: Grip & Stance",
                color: 'border-blue-600', tag: '!bg-blue-600',
                show: (role) => ROLE_BATTING.includes(role),
                fields: [
                    { id: 'b_h', label: 'Handle Position', options: ['Ideal (Middle-MH)', 'Top(TH)', 'Bottom(BH)'] },
                    { id: 'b_tv', label: 'Top Hand V', options: ['Ideal (Splice-SP)', 'Outer(BSO)', 'Inner(BSI)'] },
                    { id: 'b_bv', label: 'Bottom Hand V', options: ['Ideal (Splice-SP)', 'Outer(BSO)', 'Inner(BSI)'] },
                    { id: 'b_g', label: 'Guard Position', options: ['Middle(MS)', 'Leg(LS)', 'Off(OS)'] },
                    { id: 'b_w', label: 'Stance Width', options: ['Shoulder Width(SW)', 'Narrow(NW)', 'Wide(WD)'] },
                    { id: 'b_wt', label: 'Weight Dist.', options: ['Balanced(WEB)', 'Back Foot(WBF)', 'Front Foot(WFF)'] }
                ]
            },
            {
                key: 'bat_tech', title: "Batting: Backlift & Trigger",
                color: 'border-blue-400', tag: '!bg-blue-400',
                show: (role) => ROLE_BATTING.includes(role),
                fields: [
                    { id: 'b_bp', label: 'Backlift Path', options: ['Straight(ST)', 'Gully(GU)', 'Fine Leg(FL)'] },
                    { id: 'b_tt', label: 'Trigger Timing', options: ['Ideal (On Time-OT)', 'Early(EY)', 'Late(LT)'] },
                    { id: 'b_mp', label: 'Movement Pattern', options: ['Minimal(M)', 'Excessive(E)'] }
                ]
            },
            {
                key: 'bowling', title: "Bowling Technicals",
                color: 'border-red-600', tag: '!bg-red-600',
                show: (role) => ROLE_BOWLING.includes(role),
                fields: [
                    { id: 'bo_ru', label: 'Run Up', options: ['Ideal (Straight)', 'Curved'] },
                    { id: 'bo_lo', label: 'Loading', options: ['Ideal (Close)', 'Away'] },
                    { id: 'bo_re', label: 'Release Position', options: ['Ideal (Vertical)', 'Round Arm'] }
                ]
            },
            {
                key: 'wk', title: "Wicket Keeping",
                color: 'border-orange-600', tag: '!bg-orange-600',
                show: (role) => ROLE_WK.includes(role),
                fields: [
                    { id: 'wk_cr', label: 'Crouch Position', options: ['Ideal (Balanced)', 'Feet too wide'] },
                    { id: 'wk_gw', label: 'Glove Work', options: ['Ideal (Soft Hands)', 'Hard Hands'] }
                ]
            },
            {
                key: 'fielding', title: "Fielding & Throwing",
                color: 'border-purple-600', tag: '!bg-purple-600',
                show: () => true,
                fields: [
                    { id: 'fi_nt', label: 'Non-Throw Hand', options: ['Ideal (Steady)', 'Drop'] },
                    { id: 'fi_el', label: 'Elbow Level', options: ['Ideal (Shoulder)', 'Below Shoulder'] },
                    { id: 'fi_al', label: 'Alignment', options: ['Ideal (Towards Target)', 'Open'] }
                ]
            }
        ];

        // ============================================================
        // STATE
        // ============================================================
        let allPlayers = [];
        let currentPlayer = null;
        let sessionsCache = [];
        let currentSessionId = null;

        // ============================================================
        // HELPERS
        // ============================================================
        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }
        function formatDateDisplay(iso) {
            if (!iso) return '—';
            const d = new Date(iso + 'T00:00:00');
            if (isNaN(d)) return iso;
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        function todayISO() {
            return new Date().toISOString().slice(0, 10);
        }
        function countFlags(sessionData) {
            let n = 0;
            SECTIONS.forEach(sec => {
                if (!sec.show(sessionData.role)) return;
                sec.fields.forEach(f => {
                    const v = sessionData[f.id];
                    if (v && !v.includes('Ideal')) n++;
                });
            });
            return n;
        }

        // ============================================================
        // AUTH
        // ============================================================
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch (err) { alert("Login Failed: " + err.message); }
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        async function tryLoadSharedView() {
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('player');
            const sid = params.get('session');
            if (!pid || !sid) return false;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-interface').classList.add('hidden');
            document.getElementById('sharedView').classList.remove('hidden');

            const container = document.getElementById('sharedReportContainer');
            try {
                const pSnap = await getDoc(doc(db, 'players', pid));
                const sSnap = await getDoc(doc(db, 'players', pid, 'sessions', sid));
                if (pSnap.exists() && sSnap.exists()) {
                    const player = { id: pid, ...pSnap.data() };
                    const session = { id: sid, ...sSnap.data() };
                    window._sharedPlayer = player;
                    window._sharedSession = session;
                    container.innerHTML = buildReportHTML(player, session);
                } else {
                    container.innerHTML = '<p class="p-10 text-center text-slate-400 text-sm">This report could not be found.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="p-10 text-center text-red-400 text-sm">Unable to load this report (permission denied or link invalid).</p>';
            }
            return true;
        }

        onAuthStateChanged(auth, async (user) => {
            const isShared = await tryLoadSharedView();
            if (isShared) return;

            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                document.getElementById('coachEmailLabel').innerText = user.email || '';
                showPanel('list');
                await loadPlayers();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-interface').classList.add('hidden');
            }
        });

        // ============================================================
        // NAVIGATION
        // ============================================================
        window.showPanel = (name) => {
            document.getElementById('view-list').classList.toggle('hidden', name !== 'list');
            document.getElementById('view-detail').classList.toggle('hidden', name !== 'detail');
            document.getElementById('view-form').classList.toggle('hidden', name !== 'form');
        };

        // ============================================================
        // PLAYERS LIST
        // ============================================================
        async function loadPlayers() {
            const listEl = document.getElementById('playersList');
            listEl.innerHTML = "<p class='p-6 text-center text-[10px] italic uppercase text-slate-400'>Syncing Cloud...</p>";
            try {
                const q = query(collection(db, "players"), where("coachId", "==", auth.currentUser.uid));
                const snap = await getDocs(q);
                allPlayers = [];
                snap.forEach(d => allPlayers.push({ id: d.id, ...d.data() }));
                allPlayers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                renderPlayerList(allPlayers);
            } catch (err) {
                listEl.innerHTML = `<p class="p-6 text-center text-xs text-red-500">Could not load players: ${escapeHtml(err.message)}</p>`;
            }
        }

        function renderPlayerList(list) {
            const listEl = document.getElementById('playersList');
            if (list.length === 0) {
                listEl.innerHTML = '<p class="p-8 text-center text-xs text-slate-400 italic">No players yet. Add your first player to get started.</p>';
                return;
            }
            listEl.innerHTML = list.map(p => `
                <div class="player-card" onclick="openPlayer('${p.id}')">
                    <div>
                        <p class="font-bold text-sm text-slate-800">${escapeHtml(p.name || 'Unnamed')}</p>
                        <p class="text-[10px] text-emerald-600 uppercase font-black tracking-tighter">${escapeHtml(p.role || '')} · ${escapeHtml(p.hand || '')}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-slate-500">${p.sessionCount || 0} session${(p.sessionCount || 0) === 1 ? '' : 's'}</p>
                        <p class="text-[9px] text-slate-400">${p.lastSessionAt ? formatDateDisplay(p.lastSessionAt) : 'No sessions yet'}</p>
                    </div>
                </div>`).join('');
        }

        window.filterPlayers = (term) => {
            term = (term || '').trim().toLowerCase();
            const filtered = !term ? allPlayers : allPlayers.filter(p => (p.name || '').toLowerCase().includes(term));
            renderPlayerList(filtered);
        };

        // ============================================================
        // NEW PLAYER MODAL
        // ============================================================
        window.openNewPlayerModal = () => {
            document.getElementById('np_name').value = '';
            document.getElementById('np_age').value = '';
            document.getElementById('np_role').value = 'Batter';
            document.getElementById('np_hand').value = 'RH';
            document.getElementById('playerModal').classList.remove('hidden');
        };
        window.closeNewPlayerModal = () => document.getElementById('playerModal').classList.add('hidden');

        window.saveNewPlayer = async () => {
            const name = document.getElementById('np_name').value.trim();
            if (!name) { alert('Player name is required.'); return; }
            const player = {
                name,
                age: document.getElementById('np_age').value,
                role: document.getElementById('np_role').value,
                hand: document.getElementById('np_hand').value,
                coachId: auth.currentUser.uid,
                coachEmail: auth.currentUser.email,
                createdAt: new Date(),
                sessionCount: 0,
                lastSessionAt: null
            };
            try {
                const ref = await addDoc(collection(db, 'players'), player);
                closeNewPlayerModal();
                await loadPlayers();
                await openPlayer(ref.id);
            } catch (err) {
                alert('Could not create player: ' + err.message);
            }
        };

        // ============================================================
        // PLAYER DETAIL
        // ============================================================
        window.openPlayer = async (playerId) => {
            let player = allPlayers.find(p => p.id === playerId);
            if (!player) {
                const snap = await getDoc(doc(db, 'players', playerId));
                if (!snap.exists()) { alert('Player not found.'); return; }
                player = { id: playerId, ...snap.data() };
            }
            currentPlayer = player;
            document.getElementById('pf_name').value = player.name || '';
            document.getElementById('pf_age').value = player.age || '';
            document.getElementById('pf_role').value = player.role || 'Batter';
            document.getElementById('pf_hand').value = player.hand || 'RH';
            showPanel('detail');
            await loadSessions(playerId);
        };

        window.saveProfile = async () => {
            const name = document.getElementById('pf_name').value.trim();
            if (!name) { alert('Player name is required.'); return; }
            const updated = {
                name,
                age: document.getElementById('pf_age').value,
                role: document.getElementById('pf_role').value,
                hand: document.getElementById('pf_hand').value,
                updatedAt: new Date()
            };
            try {
                await updateDoc(doc(db, 'players', currentPlayer.id), updated);
                currentPlayer = { ...currentPlayer, ...updated };
                const idx = allPlayers.findIndex(p => p.id === currentPlayer.id);
                if (idx > -1) allPlayers[idx] = currentPlayer;
                alert('Profile updated.');
            } catch (err) {
                alert('Update failed: ' + err.message);
            }
        };

        window.confirmDeletePlayer = async () => {
            if (!confirm(`Delete ${currentPlayer.name} and ALL their session history? This cannot be undone.`)) return;
            try {
                const snap = await getDocs(collection(db, 'players', currentPlayer.id, 'sessions'));
                for (const d of snap.docs) { await deleteDoc(d.ref); }
                await deleteDoc(doc(db, 'players', currentPlayer.id));
                await loadPlayers();
                showPanel('list');
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        };

        // ============================================================
        // SESSIONS
        // ============================================================
        async function recomputePlayerAggregates(playerId) {
            const snap = await getDocs(collection(db, 'players', playerId, 'sessions'));
            let count = 0, maxDate = null;
            snap.forEach(d => {
                count++;
                const dt = d.data().date;
                if (dt && (!maxDate || dt > maxDate)) maxDate = dt;
            });
            await updateDoc(doc(db, 'players', playerId), { sessionCount: count, lastSessionAt: maxDate });
        }

        async function loadSessions(playerId) {
            const listEl = document.getElementById('sessionsList');
            listEl.innerHTML = "<p class='p-4 text-[10px] italic uppercase text-slate-400'>Loading sessions...</p>";
            const snap = await getDocs(collection(db, 'players', playerId, 'sessions'));
            sessionsCache = [];
            snap.forEach(d => sessionsCache.push({ id: d.id, ...d.data() }));
            sessionsCache.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            renderSessions(sessionsCache);
        }

        function renderSessions(sessions) {
            const listEl = document.getElementById('sessionsList');
            if (sessions.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 italic p-4">No sessions recorded yet. Click "New Session" to add the first assessment.</p>';
                return;
            }
            listEl.innerHTML = sessions.map(s => {
                const flags = countFlags(s);
                const flagLabel = flags > 0
                    ? `<span class="text-red-500 font-bold">${flags} flagged</span>`
                    : `<span class="text-emerald-500 font-bold">All ideal</span>`;
                return `<div class="session-row">
                    <div>
                        <p class="font-bold text-xs text-slate-800">${formatDateDisplay(s.date)}</p>
                        <p class="text-[9px] text-slate-400 uppercase font-bold">${escapeHtml(s.role || '')} · ${flagLabel}</p>
                    </div>
                    <div class="flex gap-1 flex-wrap justify-end">
                        <button onclick="openSession('${s.id}')" class="btn-mini bg-slate-100 text-slate-700">Edit</button>
                        <button onclick="quickDownload('${s.id}')" class="btn-mini bg-emerald-100 text-emerald-700">PDF</button>
                        <button onclick="copyShareLink('${s.id}')" class="btn-mini bg-blue-100 text-blue-700">Link</button>
                        <button onclick="confirmDeleteSession('${s.id}')" class="btn-mini bg-red-100 text-red-700">Del</button>
                    </div>
                </div>`;
            }).join('');
        }

        window.copyShareLink = (sessionId) => {
            const url = `${location.origin}${location.pathname}?player=${currentPlayer.id}&session=${sessionId}`;
            navigator.clipboard.writeText(url);
            alert('Share link copied!');
        };

        window.quickDownload = (sessionId) => {
            const s = sessionsCache.find(x => x.id === sessionId);
            if (s) downloadPDF(currentPlayer, s);
        };

        window.confirmDeleteSession = async (sessionId) => {
            if (!confirm('Delete this session record?')) return;
            try {
                await deleteDoc(doc(db, 'players', currentPlayer.id, 'sessions', sessionId));
                await recomputePlayerAggregates(currentPlayer.id);
                await loadSessions(currentPlayer.id);
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        };

        // ============================================================
        // SESSION FORM
        // ============================================================
        function fieldSelectHTML(field, currentValue) {
            const opts = field.options.map(o => `<option value="${o}" ${o === currentValue ? 'selected' : ''}>${o}</option>`).join('');
            return `<div><label>${field.label}</label><select id="${field.id}">${opts}</select></div>`;
        }

        function renderSessionForm(role, data) {
            const visible = SECTIONS.filter(sec => sec.show(role));
            document.getElementById('dynamicSections').innerHTML = visible.map(sec => `
                <div class="form-card border-t-4 ${sec.color}">
                    <span class="pro-tag ${sec.tag}">${sec.title}</span>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        ${sec.fields.map(f => fieldSelectHTML(f, data[f.id])).join('')}
                    </div>
                </div>`).join('');
        }

        function readFormData() {
            const data = {
                date: document.getElementById('sessionDate').value,
                summary: document.getElementById('pSummary').value
            };
            SECTIONS.forEach(sec => sec.fields.forEach(f => {
                const el = document.getElementById(f.id);
                data[f.id] = el ? el.value : '';
            }));
            return data;
        }

        window.openNewSession = () => {
            currentSessionId = null;
            document.getElementById('formTitle').innerText = `New Session — ${currentPlayer.name}`;
            document.getElementById('sessionDate').value = todayISO();
            document.getElementById('pSummary').value = '';
            renderSessionForm(currentPlayer.role, {});
            showPanel('form');
        };

        window.openSession = (sessionId) => {
            const s = sessionsCache.find(x => x.id === sessionId);
            if (!s) return;
            currentSessionId = sessionId;
            document.getElementById('formTitle').innerText = `Edit Session — ${formatDateDisplay(s.date)}`;
            document.getElementById('sessionDate').value = s.date || todayISO();
            document.getElementById('pSummary').value = s.summary || '';
            renderSessionForm(s.role || currentPlayer.role, s);
            showPanel('form');
        };

        window.cancelSessionForm = () => showPanel('detail');

        window.saveSession = async () => {
            const data = readFormData();
            data.role = currentPlayer.role;
            data.coachId = auth.currentUser.uid;
            data.coachEmail = auth.currentUser.email;
            data.updatedAt = new Date();
            try {
                if (currentSessionId) {
                    await updateDoc(doc(db, 'players', currentPlayer.id, 'sessions', currentSessionId), data);
                } else {
                    data.createdAt = new Date();
                    await addDoc(collection(db, 'players', currentPlayer.id, 'sessions'), data);
                }
                await recomputePlayerAggregates(currentPlayer.id);
                alert('Session saved.');
                await openPlayer(currentPlayer.id);
            } catch (err) {
                alert('Save failed: ' + err.message);
            }
        };

        window.downloadCurrentFormPDF = () => {
            const data = readFormData();
            data.role = currentPlayer.role;
            downloadPDF(currentPlayer, data);
        };

        window.downloadSharedPDF = () => {
            if (window._sharedPlayer && window._sharedSession) downloadPDF(window._sharedPlayer, window._sharedSession);
        };

        // ============================================================
        // REPORT / PDF ENGINE
        // Builds the same HTML for on-screen shared view AND for the PDF,
        // driven entirely by the SECTIONS config + a plain data object
        // (never reads from the live DOM here — avoids ID-mismatch bugs).
        // ============================================================
        function sectionTableHTML(sec, data) {
            const rows = sec.fields.map(f => {
                const val = data[f.id] || 'Ideal';
                const color = val.includes('Ideal') ? '#10b981' : '#ef4444';
                return `<tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 6px 8px; color: #64748b; font-weight: bold; width: 45%; text-transform: uppercase; font-size: 9px;">${escapeHtml(f.label)}</td>
                            <td style="padding: 6px 8px; color: ${color}; font-weight: bold;">${escapeHtml(val)}</td>
                        </tr>`;
            }).join('');
            return `<div class="pdf-block" style="page-break-inside: avoid; break-inside: avoid;">
                        <h2 style="font-size: 14px; color: #065f46; border-bottom: 2px solid #065f46; padding-bottom: 3px; margin-top:16px; margin-bottom: 8px; text-transform: uppercase;">${escapeHtml(sec.title)}</h2>
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 11px;">${rows}</table>
                    </div>`;
        }

        function buildReportHTML(player, session) {
            const dateStr = formatDateDisplay(session.date) !== '—' ? formatDateDisplay(session.date) : new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const role = session.role || player.role;

            let html = `<div style="font-family: Arial, sans-serif; padding: 40px; color: #1e293b;">
                <div style="display: flex; justify-content: space-between; border-bottom: 5px solid #065f46; padding-bottom: 10px; margin-bottom: 20px;">
                    <div>
                        <h1 style="margin:0; color:#065f46; font-size:32px; font-weight:900; line-height:1;">COACH'S LENS</h1>
                        <p style="margin:0; font-size:10px; font-weight:bold; color:#64748b; text-transform:uppercase; letter-spacing:2px;">Elite Player Performance Analysis</p>
                    </div>
                    <div style="text-align:right;">
                        <p style="margin:0; font-size:14px; color:#1e293b;"><b>SESSION DATE:</b> ${escapeHtml(dateStr)}</p>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:25px; border:1px solid #e2e8f0; font-size:12px;">
                    <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Player</small><br><b>${escapeHtml(player.name || 'Unnamed')}</b></div>
                    <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Age</small><br><b>${escapeHtml(player.age || 'N/A')}</b></div>
                    <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Role</small><br><b>${escapeHtml(role)}</b></div>
                    <div><small style="color:#64748b; font-size:9px; font-weight:bold; text-transform:uppercase;">Hand</small><br><b>${escapeHtml(player.hand || '')}</b></div>
                </div>`;

            SECTIONS.forEach(sec => {
                if (sec.show(role)) html += sectionTableHTML(sec, session);
            });

            html += `<div class="pdf-block" style="page-break-inside: avoid; break-inside: avoid; margin-top: 16px; border-top: 3px solid #065f46; padding-top:12px;">
                    <h2 style="font-size: 14px; color: #065f46; margin-bottom: 8px; text-transform: uppercase;">Coach's Overall Summary</h2>
                    <div style="background: #fffbeb; border: 1px solid #fef3c7; padding: 16px; border-radius: 8px; font-size: 12px; line-height: 1.6; color: #451a03;">
                        ${(session.summary || 'No summary provided.').replace(/\n/g, '<br>')}
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center; font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">
                    Verified Professional Performance Document | Coach's Lens Analytics
                </div>
            </div>`;

            return html;
        }

        function downloadPDF(player, session) {
            const pdfContainer = document.createElement('div');
            pdfContainer.style.width = "800px";
            pdfContainer.style.background = "white";
            pdfContainer.style.margin = "0";
            pdfContainer.style.padding = "0";
            pdfContainer.innerHTML = buildReportHTML(player, session);

            const fileDate = session.date || 'draft';
            const opt = {
                margin: [10, 10, 10, 10],
                filename: `CoachsLens_${(player.name || 'Player').replace(/\s+/g, '_')}_${fileDate}.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, y: 0, scrollY: 0 },
                jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'css' }
            };

            html2pdf().set(opt).from(pdfContainer).save();
        }
    </script>

    <style>
        .form-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { font-weight: 800; color: #64748b; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 0.2rem; display: block; }
        select, input, textarea { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 0.85rem; width: 100%; }
        .pro-tag { background: #0f172a; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-bottom: 15px; display: inline-block; }
        .player-card { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
        .player-card:hover { background: #f8fafc; }
        .session-row { padding: 0.75rem 0.25rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .session-row:last-child { border-bottom: none; }
        .btn-mini { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4 hidden">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-emerald-500 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter mb-4">COACH'S LENS</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div><label>Coach Email</label><input type="email" id="loginEmail" required></div>
                <div><label>Password</label><input type="password" id="loginPass" required></div>
                <button type="submit" class="w-full bg-slate-900 text-emerald-400 font-black py-4 rounded-xl uppercase tracking-widest text-xs shadow-lg">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-interface" class="hidden">
        <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
            <h1 class="text-xl font-black italic tracking-tighter text-emerald-400">COACH'S LENS</h1>
            <div class="flex gap-4 items-center">
                <span id="coachEmailLabel" class="text-[10px] text-slate-400 font-bold"></span>
                <button onclick="handleLogout()" class="text-[10px] font-bold text-slate-400 underline">Logout</button>
            </div>
        </nav>

        <div class="max-w-[1000px] mx-auto p-6">

            <!-- PLAYERS LIST VIEW -->
            <div id="view-list">
                <div class="flex justify-between items-center mb-4 gap-3">
                    <input type="text" id="searchBox" placeholder="Search players..." oninput="filterPlayers(this.value)" class="max-w-xs bg-white">
                    <button onclick="openNewPlayerModal()" class="bg-emerald-600 text-white px-5 py-3 rounded-md font-black text-[10px] uppercase shadow-lg whitespace-nowrap">+ New Player</button>
                </div>
                <div class="bg-white rounded-xl shadow border overflow-hidden">
                    <p class="bg-slate-800 text-white p-2 text-[10px] font-black uppercase text-center">Your Players</p>
                    <div id="playersList"></div>
                </div>
            </div>

            <!-- PLAYER DETAIL VIEW -->
            <div id="view-detail" class="hidden">
                <button onclick="showPanel('list')" class="text-xs text-slate-500 underline mb-4">&larr; Back to Players</button>

                <div class="form-card border-l-8 border-emerald-500">
                    <span class="pro-tag">Basic Profile</span>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label>Player Name</label><input type="text" id="pf_name"></div>
                        <div><label>Age</label><input type="number" id="pf_age"></div>
                        <div><label>Role</label><select id="pf_role"><option value="Batter">Batter</option><option value="Bowler">Bowler</option><option value="All rounder">All rounder</option><option value="WK batter">WK batter</option></select></div>
                        <div><label>Hand</label><select id="pf_hand"><option>RH</option><option>LH</option></select></div>
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="saveProfile()" class="bg-slate-900 text-white px-5 py-2 rounded-md font-black text-[10px] uppercase">Save Profile</button>
                        <button onclick="confirmDeletePlayer()" class="bg-red-100 text-red-700 px-5 py-2 rounded-md font-black text-[10px] uppercase">Delete Player</button>
                    </div>
                </div>

                <div class="form-card">
                    <div class="flex justify-between items-center mb-2">
                        <span class="pro-tag !bg-slate-700">Session History</span>
                        <button onclick="openNewSession()" class="bg-emerald-600 text-white px-4 py-2 rounded-md font-black text-[10px] uppercase shadow">+ New Session</button>
                    </div>
                    <div id="sessionsList"></div>
                </div>
            </div>

            <!-- SESSION FORM VIEW -->
            <div id="view-form" class="hidden">
                <button onclick="cancelSessionForm()" class="text-xs text-slate-500 underline mb-4">&larr; Back to Player</button>
                <h2 id="formTitle" class="text-lg font-black mb-4 text-slate-800"></h2>

                <div class="form-card">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label>Session Date</label><input type="date" id="sessionDate"></div>
                    </div>
                </div>

                <div id="dynamicSections"></div>

                <div class="form-card bg-slate-900 text-white shadow-2xl">
                    <label class="text-emerald-400">Coach Observations</label>
                    <textarea id="pSummary" class="text-slate-900 h-40 w-full p-4 rounded-md mb-4" placeholder="Detailed notes..."></textarea>
                    <div class="flex gap-2">
                        <button onclick="saveSession()" class="bg-emerald-500 text-slate-900 font-black py-4 rounded-xl flex-1 uppercase tracking-widest text-xs shadow-lg">Save Session</button>
                        <button onclick="downloadCurrentFormPDF()" class="bg-white text-slate-900 font-black py-4 rounded-xl px-6 uppercase tracking-widest text-xs shadow-lg">PDF</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- NEW PLAYER MODAL -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md">
            <h3 class="font-black text-lg mb-4 text-slate-800">New Player</h3>
            <div class="space-y-3">
                <div><label>Name</label><input type="text" id="np_name"></div>
                <div><label>Age</label><input type="number" id="np_age"></div>
                <div><label>Role</label><select id="np_role"><option value="Batter">Batter</option><option value="Bowler">Bowler</option><option value="All rounder">All rounder</option><option value="WK batter">WK batter</option></select></div>
                <div><label>Hand</label><select id="np_hand"><option>RH</option><option>LH</option></select></div>
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="saveNewPlayer()" class="bg-emerald-600 text-white flex-1 py-3 rounded-md font-black text-[10px] uppercase">Create</button>
                <button onclick="closeNewPlayerModal()" class="bg-slate-100 text-slate-600 flex-1 py-3 rounded-md font-black text-[10px] uppercase">Cancel</button>
            </div>
        </div>
    </div>

    <!-- SHARED READ-ONLY VIEW -->
    <div id="sharedView" class="hidden min-h-screen bg-slate-100 p-6">
        <div class="max-w-3xl mx-auto">
            <div class="flex justify-end mb-4">
                <button onclick="downloadSharedPDF()" class="bg-emerald-600 text-white px-5 py-3 rounded-md text-[10px] font-black uppercase shadow-lg">Download PDF</button>
            </div>
            <div id="sharedReportContainer" class="bg-white rounded-xl shadow border overflow-hidden"></div>
        </div>
    </div>

</body>
</html>
